spring:
  application:
    name: chat-service
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  elasticsearch:
    uris: ${ELASTICSEARCH_HOSTS:localhost:9200}
    socket-timeout: 5m
    username:
    password:
  data:
    mongodb:
      repositories:
        type: reactive
      auto-index-creation: true
  jackson:
    datatype:
      enum:
        read-enums-using-to-string: false
        write-enums-using-to-string: false
  rabbitmq:
    listener:
      direct:
        acknowledge-mode: manual
      simple:
        acknowledge-mode: manual
  mongodb:
    database: ${MONGODB_CHAT_SERVICE:chat-service}
    host: ${MONGODB_HOST:localhost}
    port: ${MONGODB_PORT:27017}

server:
  port: 8085

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    appname: 'chat-service'
    instance-id: 'chat-service-${server.port}'

ribbon:
  eureka:
    enabled: true

scheduled:
  messages:
    check:
      enabled: true
chatox:
  jwt:
    public-key: 
  method:
    logging:
      enabled: true
  elasticsearch:
    sync:
      messages:
        sync-on-start: false
        delete-before-import: true
      chats:
        sync-on-start: false
  uploads:
    images: ${API_HOST:http://localhost:8080}/api/v1/uploads/images
    videos: ${API_HOST:http://localhost:8080}/api/v1/uploads/videos
    files: ${API_HOST:http://localhost:8080}/api/v1/uploads/files
    audios: ${API_HOST:http://localhost:8080}/api/v1/uploads/audios
    image-stickers: ${API_HOST:http://localhost:8080}/api/v1/uploads/stickers/image
    webp-stickers: ${API_HOST:http://localhost:8080}/api/v1/uploads/stickers/webp
    video-stickers: ${API_HOST:http://localhost:8080}/api/v1/uploads/stickers/video
    lottie-stickers: ${API_HOST:http://localhost:8080}/api/v1/uploads/stickers/lottie

mongration:
  # disable until Spring Boot 4 support is added https://github.com/KuliginStepan/mongration/issues/26
  enabled: false
  mode: reactive